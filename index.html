<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0a10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="拾色">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex,nofollow">
<title>拾色 GRAFT</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-180.png">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="app">
  <div id="wrap">
    <canvas id="cv" width="640" height="360"></canvas>
    <div id="hud">
      <div class="tl">拾色 <b>GRAFT</b></div>
      <div class="tr"><span id="wbar" title="重量:越重跳得越低,12.5 以上能压塌脆地板"><b>W</b><span class="tk"><i></i><em></em></span></span><span id="seedCount" aria-label="本关光种"></span><span id="lv"></span>
        <button class="ibtn" id="btnPause" type="button" aria-label="暂停">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3v10M11 3v10"/></svg>
        </button>
        <button class="ibtn" id="btnSound" type="button" aria-label="声音">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path class="on" d="M2 6h3l4-3v10l-4-3H2zM11 5.5c1 .8 1.5 1.6 1.5 2.5s-.5 1.7-1.5 2.5"/><path class="off" d="M2 6h3l4-3v10l-4-3H2zM11 6l4 4M15 6l-4 4"/></svg>
        </button>
        <button class="ibtn" id="btnFull" type="button" aria-label="全屏">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4"/></svg>
        </button>
      </div>
      <div id="bag"></div>
      <div id="hint"></div>
      <div id="toast"></div>
      <div id="card"><div class="cn"></div><div class="cs"></div></div>
    </div>

    <div id="editor" class="hide" role="dialog" aria-label="改造身体">
      <div class="ed-panel">
        <div class="ed-head"><span>改造身体</span><small id="edW"></small></div>
        <canvas id="edCv" width="256" height="256"></canvas>
        <div id="edBag"></div>
        <div id="edMatHint" class="ed-material" aria-live="polite"></div>
        <div class="ed-tip">点<b>空位</b>贴上所选材料 · 点<b>身体</b>削下一格<br><i class="lg ok"></i>可贴　<i class="lg cut"></i>可削　<i class="lg no"></i>被墙挡住</div>
        <div class="ed-row"><button id="edUndo" class="btn" type="button" disabled>撤　销</button><button id="edDone" class="btn primary" type="button">完　成</button></div>
      </div>
    </div>

    <div id="pause" class="hide" role="dialog" aria-label="暂停">
      <div class="pm-panel">
        <div class="pm-head">暂　停<small id="pmLevel"></small></div>
        <button id="pmResume" class="btn primary" type="button">继续</button>
        <button id="pmRetry" class="btn" type="button">重来本关</button>
        <div class="pm-sub">选关</div>
        <div id="pmLevels"></div>
        <div class="pm-row"><button id="pmSound" class="btn" type="button">声音:开</button><button id="pmTitle" class="btn" type="button">回到标题</button></div>
      </div>
    </div>

    <div id="overlay">
      <canvas id="portraitCv" width="240" height="116" aria-label="戴护目镜的拼装小探险家"></canvas>
      <div class="logo">拾色</div>
      <div class="sub">拼出自己的冒险</div>
      <div class="journey-note">五种材料 · 十二处遗迹 · 不止一条路</div>
      <div class="menu">
        <button class="btn primary" id="btnStart" type="button">开始游戏</button>
        <button class="btn" id="btnCont" type="button"></button>
      </div>
      <div class="keys desk">
        <kbd>A</kbd><kbd>D</kbd> 移动　<kbd>空格</kbd> 跳　点击身体削一格　点击空位贴一格<br>
        <kbd>1</kbd>–<kbd>5</kbd> 选材料　<kbd>E</kbd> 改造面板　<kbd>Z</kbd> 撤销　<kbd>Esc</kbd> 暂停　<kbd>M</kbd> 静音
      </div>
      <div class="keys ios" id="iosTip" hidden>iPhone:点 Safari 底部的 <b>分享</b> → <b>添加到主屏幕</b>,从桌面图标打开就是全屏</div>
      <div class="keys touch">左下拇指 <b>滑动</b> 移动 · 右下 <b>跳</b> · <b>改</b> 打开改造面板<br>也可以直接点自己身体削格、点旁边空位贴格</div>
    </div>
  </div>

  <div id="pad" aria-hidden="true">
    <div id="move"><span class="ar l"></span><span class="knob"></span><span class="ar r"></span></div>
    <div class="rbtns">
      <button id="btnUndo" class="off" type="button" aria-label="撤销">↶</button>
      <button id="btnEdit" type="button">改</button>
      <button id="btnJump" type="button">跳</button>
    </div>
  </div>
  <div id="rotate">横过来玩更爽 ↻</div>
</div>
<script src="src/game.js"></script>
</body>
</html>
