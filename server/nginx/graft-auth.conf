# 校验口令网关签发的 cookie(nginx 自带 secure_link 模块,不经过 Python)
if ($graft_secret = "") { return 503; }      # 密钥没配好时宁可停服,也不能放行
secure_link     $cookie_gt_sig,$cookie_gt_exp;
secure_link_md5 "$secure_link_expires $cookie_gt_id $graft_secret";
if ($secure_link = "")  { return 302 /__gate/login; }
if ($secure_link = "0") { return 302 /__gate/login?expired=1; }
