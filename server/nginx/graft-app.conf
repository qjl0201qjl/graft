# 拾色 GRAFT · 站点主体  →  /etc/nginx/snippets/graft-app.conf
# 被 HTTPS 站点(或 --http-only 模式下的 80 端口站点)include。

root  /srv/graft/current;
index index.html;
charset utf-8;
server_tokens off;

access_log /var/log/nginx/graft.access.log graft;
error_log  /var/log/nginx/graft.error.log warn;

# ── 连接与超时:防慢速攻击(slowloris)
client_max_body_size      4k;
client_body_timeout       10s;
client_header_timeout     10s;
send_timeout              20s;
keepalive_timeout         30s;
keepalive_requests        1000;
large_client_header_buffers 4 8k;

# ── 性能:静态文件零拷贝 + 预压缩
sendfile    on;
tcp_nopush  on;
tcp_nodelay on;
gzip        on;
gzip_vary   on;
gzip_comp_level 5;
gzip_min_length 512;
gzip_types text/plain text/css application/javascript text/javascript application/json application/manifest+json image/svg+xml;
gzip_static on;
open_file_cache          max=2000 inactive=60s;
open_file_cache_valid    30s;
open_file_cache_errors   on;

# ── 签名密钥(由 gate.py rotate-secret 生成)
include /etc/nginx/snippets/graft-secret.conf;

# ── 全站规则
if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
if ($graft_bad_ua) { return 403; }
limit_conn graft_conn 256;
limit_req  zone=graft_req burst=300 nodelay;
limit_req_status  429;
limit_conn_status 429;
limit_req_log_level warn;

location = /robots.txt {
    include /etc/nginx/snippets/graft-headers.conf;
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
}
location = /favicon.ico { access_log off; log_not_found off; return 204; }

# ── 口令网关
location = /__gate/login {
    limit_req zone=graft_login burst=60 nodelay;
    include /etc/nginx/snippets/graft-proxy.conf;
}
location ^~ /__gate/ {
    include /etc/nginx/snippets/graft-proxy.conf;
}

# ── PWA 清单与图标:浏览器取这两类文件时不带 cookie,所以放行(里面没有游戏内容)
location = /manifest.webmanifest {
    include /etc/nginx/snippets/graft-headers.conf;
    add_header Cache-Control "no-cache" always;
    default_type application/manifest+json;
    try_files $uri =404;
}
location ~ ^/static/icon-[a-z0-9-]+\.png$ {
    include /etc/nginx/snippets/graft-headers.conf;
    add_header Cache-Control "public, max-age=86400" always;
    try_files $uri =404;
}

# ── 不该被访问的东西一律 404(不暴露存在与否)
location = /static/build.json { return 404; }
location ~ /\. { return 404; }
location ~* \.(map|bak|orig|old|swp|sh|py|md|log|conf|tpl|env|ini|sql|gz|zip|tar)$ { return 404; }

# ── 游戏本体:必须带有效签名 cookie
location /static/ {
    include /etc/nginx/snippets/graft-auth.conf;
    include /etc/nginx/snippets/graft-headers.conf;
    include /etc/nginx/snippets/graft-csp.conf;
    add_header Cache-Control "private, max-age=31536000, immutable" always;
    try_files $uri =404;
}
location / {
    include /etc/nginx/snippets/graft-auth.conf;
    include /etc/nginx/snippets/graft-headers.conf;
    include /etc/nginx/snippets/graft-csp.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ =404;
}
