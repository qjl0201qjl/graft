# 拾色 GRAFT · http{} 级配置  →  /etc/nginx/conf.d/graft-http.conf
# 限流区、反爬规则、日志格式。站点本身在 sites-available/graft。

log_format graft '$remote_addr - [$time_local] "$request" $status $body_bytes_sent '
                 '"$http_user_agent" rt=$request_time sid=$cookie_gt_id';

# 白名单(校园网出口 / 你自己压测用的机器):不受限流
# 文件格式每行 "1.2.3.0/24 1;"
geo $graft_trusted {
    default 0;
    include /etc/graft/trusted-ips.conf;
}
map $graft_trusted $graft_limit_key {
    1       "";                     # key 为空 = 不计数
    default $binary_remote_addr;
}

# 限流:按 IP。数值按"一个校园网出口后面可能有几百个玩家"来定,宁松勿严;
# 真正挡人的是口令,这里只是挡刷流量和扫描器。
limit_req_zone  $graft_limit_key zone=graft_req:20m   rate=60r/s;
limit_req_zone  $graft_limit_key zone=graft_login:10m rate=60r/m;
limit_conn_zone $graft_limit_key zone=graft_conn:20m;

# 只在 HTTPS 下发 HSTS
map $scheme $graft_hsts {
    https   "max-age=31536000";
    default "";
}

# 明显的爬虫 / 扫描器 / 下载工具。UA 可以伪造,这只是第一道筛子。
map $http_user_agent $graft_bad_ua {
    default 0;
    ""      1;
    "~*(curl|wget|python-requests|python-urllib|aiohttp|httpx|scrapy|go-http-client|java/|okhttp|libwww|lwp-|httrack|webcopier|webzip|offline explorer|sitesucker|teleport|nikto|sqlmap|nmap|masscan|zgrab|nuclei|dirbuster|gobuster|feroxbuster|wpscan|headlesschrome|phantomjs|selenium|puppeteer|playwright|petalbot|semrushbot|ahrefsbot|mj12bot|dotbot|bytespider|gptbot|ccbot|claudebot|anthropic-ai|amazonbot|dataforseobot|yandexbot|baiduspider|sogou|360spider|bingbot|googlebot)" 1;
}
