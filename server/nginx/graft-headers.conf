# 安全响应头(location 里一旦写了 add_header,上层的就不继承,所以每个 location 都 include 这个文件)
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "no-referrer" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=(), fullscreen=(self)" always;
add_header Cross-Origin-Opener-Policy   "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Robots-Tag              "noindex, nofollow, noarchive" always;
add_header Strict-Transport-Security $graft_hsts always;
