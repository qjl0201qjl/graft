# /etc/fail2ban/filter.d/graft-scan.conf   (配合 nginx 的 graft 日志格式)
[Definition]
failregex = ^<HOST> - \[[^\]]+\] "[A-Z]+ /[^ ]*(?:wp-login|wp-admin|wp-content|xmlrpc\.php|\.env|\.git/|\.svn|phpmyadmin|pma/|myadmin|admin\.php|setup\.php|cgi-bin|boaform|HNAP1|actuator|vendor/phpunit|\.aws/|server-status|\.DS_Store|/etc/passwd|\.\./)[^ ]* HTTP/[0-9.]+" \d{3}
ignoreregex =
datepattern = {^LN-BEG}[^\[]*\[%%d/%%b/%%Y:%%H:%%M:%%S %%z\]
